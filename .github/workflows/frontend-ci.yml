name: Frontend CI

"on":
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    # Every `run:` step below is relative to frontend/ - this is a
    # frontend-only pipeline, not a repo-root one.
    defaults:
      run:
        working-directory: frontend

    env:
      # src/lib/env.ts throws "VITE_API_URL is not defined" at runtime if
      # this is missing, but Vite only transforms/bundles the module during
      # `vite build` - it never executes that throw. So the build would
      # otherwise succeed while silently producing a bundle that crashes on
      # load. Same placeholder value as frontend/.env.example; not a secret.
      VITE_API_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `build` runs `tsc -b && vite build` - the tsc phase is the
      # typecheck (no separate typecheck script exists), and vite build
      # is the production build. One command validates both.
      - name: Typecheck and build
        run: npm run build
