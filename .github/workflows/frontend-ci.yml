name: Frontend CI

# Pull requests run this directly (it is a required check on main). Pushes
# to main run it through release.yml, which only publishes and deploys once
# this, Backend CI and Production CI have all passed.
"on":
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # A new push to a pull request supersedes its previous run. Runs called
    # from release.yml have no PR number and are never cancelled.
    concurrency:
      group: frontend-ci-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true

    # Every `run:` step below is relative to frontend/ - this is a
    # frontend-only pipeline, not a repo-root one.
    defaults:
      run:
        working-directory: frontend

    env:
      # src/lib/env.ts throws "VITE_API_URL is not defined" at runtime if
      # this is missing, but Vite only transforms/bundles the module during
      # `vite build` - it never executes that throw. So the build would
      # otherwise succeed while silently producing a bundle that crashes on
      # load. Same placeholder value as frontend/.env.example; not a secret.
      VITE_API_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # `build` runs `tsc -b && vite build` - the tsc phase is the
      # typecheck (no separate typecheck script exists), and vite build
      # is the production build. One command validates both.
      - name: Typecheck and build
        run: npm run build
