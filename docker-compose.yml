services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-teamos}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-teamos}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - teamos-network

  redis:
    image: redis:8-alpine
    restart: unless-stopped

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - teamos-network

  # One-shot migration runner. Reuses the backend image (no separate build)
  # so `prisma migrate deploy` runs against the exact same Prisma Client,
  # schema, and migrations that backend/worker ship with. No restart policy
  # is set - the default `restart: "no"` is correct here since this
  # container is meant to run once and exit 0, which is what
  # `service_completed_successfully` below waits on; restarting it would
  # fight that one-shot contract. Redis is intentionally not a dependency:
  # `prisma migrate deploy` never touches Redis.
  migrate:
    image: teamos-backend

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    command: npx prisma migrate deploy

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - teamos-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: teamos-backend

    init: true
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    ports:
      - "3000:3000"

    volumes:
      - uploads-data:/usr/src/app/uploads

    networks:
      - teamos-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    init: true
    restart: unless-stopped

    command: npm run start:worker

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    volumes:
      - uploads-data:/usr/src/app/uploads

    networks:
      - teamos-network

networks:
  teamos-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  uploads-data: